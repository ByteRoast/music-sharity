name: Deploy Flutter Web to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Web"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "LICENSE.md"
      - "PRIVACY.md"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download web build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Flutter
        if: ${{ github.event_name != 'workflow_run' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true

      - name: Build Web
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          flutter pub get
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-6)
          flutter build web --release --base-href "/" --dart-define=COMMIT_HASH=$COMMIT_HASH

      - name: Copy documentation files
        run: |
          cp LICENSE.md build/web/
          cp PRIVACY.md build/web/
          cp .github/templates/docs.html build/web/docs.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install marked
        run: npm install marked

      - name: Convert Markdown to HTML
        run: node .github/scripts/convert-markdown.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: music-sharity.byteroast.fr
